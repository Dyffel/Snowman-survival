<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b9e9fa"><title>Snowfall — Arena Prototype 0.3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8d9ed;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;left:14px;top:max(12px,env(safe-area-inset-top));padding:10px 14px;border-radius:14px;background:#15364bc9;color:white;pointer-events:none;box-shadow:0 3px 15px #25475b35}#hud strong{font-size:16px}#hud small{display:block;opacity:.85;font-size:12px;margin-top:3px}#stick{position:fixed;bottom:max(26px,env(safe-area-inset-bottom));left:24px;width:130px;height:130px;border:2px solid #ffffff9c;border-radius:50%;background:#16394c45;touch-action:none;display:grid;place-items:center;user-select:none}#knob{width:55px;height:55px;border-radius:50%;background:#f7fdffda;border:3px solid #a5d5eb;box-shadow:0 2px 8px #16394c66;transform:translate(0,0)}#tip{position:fixed;right:14px;bottom:max(22px,env(safe-area-inset-bottom));color:white;text-shadow:0 1px 5px #143648;background:#14364880;padding:9px 12px;border-radius:12px;font-size:12px;max-width:170px;text-align:right;pointer-events:none}@media(pointer:fine){#stick{opacity:.7}}</style></head><body><canvas id="game"></canvas><div id="hud"><strong>☃️ SNOWFALL</strong><small>Arena prototype · v0.3</small></div><div id="stick"><div id="knob"></div></div><div id="tip">Explore the arena!<br>Joystick or WASD / arrows</div><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const world={w:1500,h:1500}, player={x:170,y:170,r:19},keys=new Set(),input={x:0,y:0};
// Four symmetric corner starting zones; only the northwest zone has a player for now.
const zoneSize=340;
const zones=[{x:45,y:45},{x:1115,y:45},{x:45,y:1115},{x:1115,y:1115}];
const fences=[];
function fence(x,y,w,h){fences.push({x,y,w,h})}
for(const z of zones){
 const x=z.x,y=z.y,n=zoneSize,gap=110;
 // Gap on the side pointing toward the center, with a second opening toward the center vertically.
 const right=x<world.w/2, bottom=y<world.h/2;
 const vx=right?x+n-13:x,hy=bottom?y+n-13:y;
 fence(x,y,n,13);fence(x,y+n-13,n,13);
 fence(x,y,13,n);fence(x+n-13,y,13,n);
 // Create openings in the inward-facing two sides.
 fences.splice(fences.findIndex(f=>f.x===vx&&f.y===y&&f.w===13&&f.h===n),1);
 fence(vx,y,13,(n-gap)/2);fence(vx,y+(n+gap)/2,13,(n-gap)/2);
 fences.splice(fences.findIndex(f=>f.x===x&&f.y===hy&&f.w===n&&f.h===13),1);
 fence(x,hy,(n-gap)/2,13);fence(x+(n+gap)/2,hy,(n-gap)/2,13);
}

const obstacles=[];
// Map-only crates: solid for now, no breaking, bombs or loot until later versions.
for(const z of zones){obstacles.push({x:z.x+68,y:z.y+90,w:50,h:50,type:'crate'},{x:z.x+215,y:z.y+215,w:50,h:50,type:'crate'})}
for(let row=0;row<7;row++)for(let col=0;col<7;col++){
 const x=490+col*85,y=490+row*85;
 if((row+col)%3!==0 && !(row>=2&&row<=4&&col>=2&&col<=4))obstacles.push({x,y,w:48,h:48,type:'crate'});
}
const pines=[];
for(const z of zones){pines.push({x:z.x+105,y:z.y+245,s:.58},{x:z.x+258,y:z.y+92,s:.55})}
for(let i=0;i<22;i++){const x=425+(i*167)%640,y=410+(i*263)%660;pines.push({x,y,s:.42+(i%3)*.09})}
let flakes=Array.from({length:210},(_,i)=>({x:(i*137.6)%world.w,y:(i*91.3)%world.h,r:1.2+(i%4)*.45}));
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawPine(t){ctx.save();ctx.translate(t.x,t.y);ctx.scale(t.s,t.s);ctx.fillStyle='#678b9d55';ctx.beginPath();ctx.ellipse(7,16,43,19,-.4,0,7);ctx.fill();ctx.fillStyle='#644e3b';ctx.fillRect(-6,4,12,27);for(let j=0;j<3;j++){ctx.fillStyle=['#236b66','#287c70','#319183'][j];ctx.beginPath();ctx.moveTo(0,-55+j*19);ctx.lineTo(-35+j*3,6+j*13);ctx.lineTo(35-j*3,6+j*13);ctx.closePath();ctx.fill()}ctx.fillStyle='#e7faff';ctx.beginPath();ctx.moveTo(0,-55);ctx.lineTo(-19,-22);ctx.quadraticCurveTo(-4,-27,3,-23);ctx.lineTo(17,-22);ctx.closePath();ctx.fill();ctx.restore()}
function drawObstacle(o){ctx.save();ctx.fillStyle='#5a7d8b35';rounded(o.x+6,o.y+9,o.w,o.h,12);ctx.fill();if(o.type==='snowpile'){ctx.fillStyle='#d7f2fa';rounded(o.x,o.y,o.w,o.h,24);ctx.fill();ctx.strokeStyle='#a5d7e8';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#f8feff';ctx.beginPath();ctx.ellipse(o.x+o.w*.43,o.y+o.h*.35,o.w*.32,o.h*.24,-.2,0,7);ctx.fill()}else{ctx.fillStyle=o.type==='crate'?'#a77848':'#9b7046';rounded(o.x,o.y,o.w,o.h,8);ctx.fill();ctx.strokeStyle='#69472d';ctx.lineWidth=5;ctx.stroke();ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x+7,o.y+8);ctx.lineTo(o.x+o.w-7,o.y+o.h-8);ctx.moveTo(o.x+o.w-7,o.y+8);ctx.lineTo(o.x+7,o.y+o.h-8);ctx.stroke();ctx.strokeStyle='#d9a776';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x+8,o.y+o.h*.5);ctx.lineTo(o.x+o.w-8,o.y+o.h*.5);ctx.stroke()}ctx.restore()}
function drawLog(x,y,w,h){ctx.fillStyle='#70492f';rounded(x,y,w,h,3);ctx.fill();ctx.fillStyle='#b98955';rounded(x+2,y+2,Math.max(2,w-4),Math.max(2,h-4),2);ctx.fill();ctx.strokeStyle='#744c32';ctx.lineWidth=1.3;ctx.stroke();ctx.fillStyle='#e4b980';ctx.beginPath();ctx.arc(x+w*.35,y+h*.5,2,0,7);ctx.fill()}
function drawFence(f){if(f.w>f.h){for(let x=f.x;x<f.x+f.w;x+=30)drawLog(x,f.y,Math.min(29,f.x+f.w-x),f.h)}else{for(let y=f.y;y<f.y+f.h;y+=30)drawLog(f.x,y,f.w,Math.min(29,f.y+f.h-y))}}
function drawArena(){
 ctx.fillStyle='#e3f5fb';ctx.fillRect(0,0,world.w,world.h);
 ctx.strokeStyle='#8bb9c9';ctx.lineWidth=18;ctx.strokeRect(9,9,world.w-18,world.h-18);
 for(let i=0;i<flakes.length;i++){const f=flakes[i];ctx.fillStyle=i%3===0?'#fff':'#c8e9f6';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()}
 for(const z of zones){ctx.fillStyle='#f5fcff';ctx.fillRect(z.x+13,z.y+13,zoneSize-26,zoneSize-26)}
 for(const tree of pines)drawPine(tree);
 for(const o of obstacles)drawObstacle(o);
 for(const f of fences)drawFence(f);
}
function drawSnowman(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#476f8050';ctx.beginPath();ctx.ellipse(5,19,23,10,0,0,7);ctx.fill();ctx.fillStyle='#f9feff';ctx.strokeStyle='#b3d9e8';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,5,19,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-15,14,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#293e4b';ctx.beginPath();ctx.arc(-5,-18,2.2,0,7);ctx.arc(5,-18,2.2,0,7);ctx.fill();ctx.fillStyle='#ed8a37';ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(13,-10);ctx.lineTo(0,-9);ctx.closePath();ctx.fill();ctx.fillStyle='#2b4c59';ctx.beginPath();ctx.arc(0,1,2.2,0,7);ctx.arc(0,10,2.2,0,7);ctx.fill();ctx.fillStyle='#4b7391';ctx.fillRect(-13,-32,26,5);ctx.fillRect(-9,-47,18,16);ctx.restore()}
function intersects(x,y,o){let cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));return (x-cx)**2+(y-cy)**2<(player.r+3)**2}
function move(dx,dy){const nx=Math.max(26+player.r,Math.min(world.w-26-player.r,player.x+dx));if(![...obstacles,...fences].some(o=>intersects(nx,player.y,o)))player.x=nx;const ny=Math.max(26+player.r,Math.min(world.h-26-player.r,player.y+dy));if(![...obstacles,...fences].some(o=>intersects(player.x,ny,o)))player.y=ny}
let lastTime=0;
function frame(t){
 const dt=Math.min((t-(lastTime||t))/1000,.05);lastTime=t;
 let vx=input.x,vy=input.y;
 if(keys.has('arrowleft')||keys.has('a'))vx-=1;
 if(keys.has('arrowright')||keys.has('d'))vx+=1;
 if(keys.has('arrowup')||keys.has('w'))vy-=1;
 if(keys.has('arrowdown')||keys.has('s'))vy+=1;
 const mag=Math.hypot(vx,vy);
 // Same world-units-per-second on desktop and mobile, independent of FPS.
 if(mag>.04)move(vx/mag*175*dt,vy/mag*175*dt);
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#b5e3f2';ctx.fillRect(0,0,W,H);
 // Identical square world visibility on mobile and desktop.
 // On wide screens the extra horizontal space is only decorative background.
 const viewWorld=420;
 const viewPx=Math.min(W,H);
 const scale=viewPx/viewWorld;
 const ox=W/2-player.x*scale,oy=H/2-player.y*scale;
 ctx.save();ctx.beginPath();ctx.rect((W-viewPx)/2,(H-viewPx)/2,viewPx,viewPx);ctx.clip();ctx.translate(ox,oy);ctx.scale(scale,scale);
 drawArena();drawSnowman();ctx.restore();requestAnimationFrame(frame)
}requestAnimationFrame(frame);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){keys.add(k);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();input.x=0;input.y=0;knob.style.transform='translate(0,0)'});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let pointer=null;function updateStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy;const length=Math.hypot(x,y),max=43;if(length>max){x*=max/length;y*=max/length}input.x=x/max;input.y=y/max;knob.style.transform=`translate(${x}px,${y}px)`}stick.addEventListener('pointerdown',e=>{if(pointer!==null)return;pointer=e.pointerId;stick.setPointerCapture(pointer);updateStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)updateStick(e)});function end(e){if(e.pointerId!==pointer)return;pointer=null;input.x=0;input.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);
</script></body></html>
