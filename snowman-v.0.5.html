<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><title>SNOWMAN v0.5 — Building grid</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#132b32;font-family:system-ui,-apple-system,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#game{position:relative;width:min(100vw,100dvh);height:min(100vw,100dvh);max-width:100%;max-height:100%;background:#edf9f7;overflow:hidden;box-shadow:0 0 0 2px #557a7c}canvas{display:block;width:100%;height:100%;touch-action:none}#label{position:absolute;top:10px;left:12px;font-weight:900;letter-spacing:1px;color:#2d6665;font-size:clamp(12px,2.7vw,16px);pointer-events:none}#label small{font-weight:500;letter-spacing:0}#joy{position:absolute;bottom:14px;left:14px;width:118px;height:118px;border-radius:50%;background:#346d7580;border:2px solid #e8ffffa6;touch-action:none;display:none;align-items:center;justify-content:center}#nub{width:48px;height:48px;border-radius:50%;background:#e8fff4;border:3px solid #83b5b4;box-shadow:0 2px 8px #1236;transform:translate(0,0)}#hint{position:absolute;right:12px;bottom:12px;color:#28595a;font-size:12px;background:#e9fffaaf;border-radius:8px;padding:6px 9px;pointer-events:none}@media (pointer:coarse){#joy{display:flex}#hint{display:none}}@media(min-width:800px){#game{border-radius:6px}}
</style></head><body><div id="game"><canvas id="screen" width="640" height="640"></canvas><div id="label">☃️ SNOWMAN <small>v0.5 · Building grid test</small></div><div id="joy"><div id="nub"></div></div><div id="hint">32×32 grid · WASD / Arrow keys</div></div>
<script>
'use strict';
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),joy=document.getElementById('joy'),nub=document.getElementById('nub');
const VIEW=640,WORLD=1280,R=20,SPEED=215;
// 32 x 32 equal building tiles. Every quadrant has exactly 16 x 16 = 256 tiles.
const TILE=40, GRID=WORLD/TILE;
const starts=[{x:160,y:160},{x:1120,y:160},{x:160,y:1120},{x:1120,y:1120}];
const player={x:starts[0].x,y:starts[0].y};let camera={x:0,y:0};
const keys=new Set();let joystick={x:0,y:0},pointerId=null;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','W','A','S','D'].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase())});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();joystick={x:0,y:0};resetJoy()});
function resetJoy(){nub.style.transform='translate(0px,0px)'}
function moveJoy(e){const b=joy.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),limit=b.width*.32;if(d>limit){dx*=limit/d;dy*=limit/d}joystick={x:dx/limit,y:dy/limit};nub.style.transform=`translate(${dx}px,${dy}px)`}
joy.addEventListener('pointerdown',e=>{e.preventDefault();pointerId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===pointerId)moveJoy(e)});
for(const type of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(type,e=>{if(e.pointerId===pointerId){pointerId=null;joystick={x:0,y:0};resetJoy()}});
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){
ctx.clearRect(0,0,VIEW,VIEW);ctx.fillStyle='#eaf8f4';ctx.fillRect(0,0,VIEW,VIEW);
ctx.save();ctx.translate(-camera.x,-camera.y);
// Same arena, four symmetric starts; only the placement grid is new.
ctx.fillStyle='#f8fffc';ctx.fillRect(0,0,WORLD,WORLD);
// Visible placement grid, aligned exactly across all four equally sized quadrants.
ctx.beginPath();ctx.lineWidth=1;ctx.strokeStyle='#d8e8e4';
for(let n=0;n<=GRID;n++){let p=n*TILE;ctx.moveTo(p,0);ctx.lineTo(p,WORLD);ctx.moveTo(0,p);ctx.lineTo(WORLD,p)}ctx.stroke();
// Subtle boundary around each of the four equal 16x16 building territories.
ctx.lineWidth=3;ctx.strokeStyle='#a4d2c7';
for(let row=0;row<2;row++)for(let col=0;col<2;col++)ctx.strokeRect(col*WORLD/2+2,row*WORLD/2+2,WORLD/2-4,WORLD/2-4);
ctx.strokeStyle='#b7d9d5';ctx.lineWidth=2;ctx.setLineDash([14,16]);ctx.beginPath();ctx.moveTo(WORLD/2,0);ctx.lineTo(WORLD/2,WORLD);ctx.moveTo(0,WORLD/2);ctx.lineTo(WORLD,WORLD/2);ctx.stroke();ctx.setLineDash([]);
ctx.lineWidth=12;ctx.strokeStyle='#376d72';ctx.strokeRect(6,6,WORLD-12,WORLD-12);
starts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,98,0,Math.PI*2);ctx.fillStyle='#d4f2e9';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#83c5b6';ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,73,0,Math.PI*2);ctx.strokeStyle='#b4ded2';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#47877e';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('START '+(i+1),p.x,p.y+129)});
// Player: simple cute green ball with small ears, eyes and smile.
ctx.save();ctx.translate(player.x,player.y);
ctx.fillStyle='#b1dcd0';ctx.beginPath();ctx.ellipse(4,17,23,9,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#50b979';ctx.strokeStyle='#26754f';ctx.lineWidth=2.5;
ctx.beginPath();ctx.ellipse(-13,-17,7,12,-.35,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(13,-17,7,12,.35,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle='white';ctx.beginPath();ctx.arc(-7,-4,5.5,0,Math.PI*2);ctx.arc(7,-4,5.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#173b31';ctx.beginPath();ctx.arc(-6,-3,2.5,0,Math.PI*2);ctx.arc(8,-3,2.5,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#173b31';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,4,7,.12,Math.PI-.12);ctx.stroke();ctx.restore();ctx.restore();
}
let prev=performance.now();function frame(now){const dt=Math.min((now-prev)/1000,.05);prev=now;let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joystick.x,dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joystick.y;const mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag}player.x=Math.max(R+12,Math.min(WORLD-R-12,player.x+dx*SPEED*dt));player.y=Math.max(R+12,Math.min(WORLD-R-12,player.y+dy*SPEED*dt));camera.x=Math.max(0,Math.min(WORLD-VIEW,player.x-VIEW/2));camera.y=Math.max(0,Math.min(WORLD-VIEW,player.y-VIEW/2));draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
